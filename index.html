<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premier League-tabell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <div class="hero-mark">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg"
            alt="Fotball"
            class="hero-ball"
          />
          <h1>Premier League</h1>
        </div>
      </section>

      <section class="transfer-card">
        <div class="transfer-heading">
          <div>
            <p class="eyebrow">Overganger</p>
            <h2>Søk etter overganger</h2>
          </div>
        </div>

        <div class="transfer-controls">
          <label class="field">
            <div class="search-input-wrap">
              <input
                id="transferQueryInput"
                type="text"
                autocomplete="off"
                placeholder="Søk på spiller eller lag"
              />
              <div id="transferSuggestions" class="search-suggestions" hidden></div>
            </div>
          </label>

          <label class="field field-small">
            <span>Sesongfilter</span>
            <select id="transferSeasonInput">
              <option value="">Alle sesonger</option>
            </select>
          </label>

          <button id="transferSearchButton" type="button">Finn overganger</button>
        </div>

        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th><button type="button" class="sort-button" data-sort-key="playerName">Spiller</button></th>
                <th><button type="button" class="sort-button" data-sort-key="fromClub">Fra</button></th>
                <th><button type="button" class="sort-button" data-sort-key="toClub">Til</button></th>
                <th><button type="button" class="sort-button" data-sort-key="fee">Sum</button></th>
                <th><button type="button" class="sort-button" data-sort-key="period">Vindu</button></th>
                <th><button type="button" class="sort-button" data-sort-key="season">Sesong</button></th>
              </tr>
            </thead>
            <tbody id="transferTableBody">
              <tr>
                <td colspan="6" class="empty-state">
                  Ingen overganger lastet ennå.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="table-card">
        <div class="table-heading">
          <p class="eyebrow">Tabell</p>
          <h2 id="tableTitle">PL 25/26</h2>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Lag</th>
                <th>K</th>
                <th>V</th>
                <th>U</th>
                <th>T</th>
                <th>MF</th>
                <th>MM</th>
                <th>DIFF</th>
                <th>P</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td colspan="10" class="empty-state">
                  Ingen data lastet ennå.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>

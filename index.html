<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premier League-tabell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <p class="eyebrow">Premier League</p>
        <h1>Offisiell tabell via trygg lokal proxy</h1>
        <p class="intro">
          Nettsiden henter tabellen fra <code>football-data.org</code> gjennom en
          lokal PowerShell-server, slik at API-tokenet ikke eksponeres i nettleseren.
        </p>
      </section>

      <section class="control-panel">
        <label class="field field-small">
          <span>Sesong</span>
          <input id="seasonInput" type="number" min="2020" step="1" />
        </label>

        <button id="loadButton" type="button">Oppdater tabell</button>
      </section>

      <section class="status-card">
        <p id="statusText">Starter opp. Husk å kjøre den lokale serveren først.</p>
        <p id="metaText" class="meta"></p>
      </section>

      <section class="table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Lag</th>
                <th>K</th>
                <th>V</th>
                <th>U</th>
                <th>T</th>
                <th>MF</th>
                <th>MM</th>
                <th>DIFF</th>
                <th>P</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td colspan="10" class="empty-state">
                  Ingen data lastet ennå.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
